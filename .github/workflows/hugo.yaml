name: Build and deploy academic website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.143.0
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
    steps:
      - name: Checkout source and pinned theme
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js for build validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Hugo Extended
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Build production website
        run: hugo --gc --minify --cleanDestinationDir
      - name: Check links, metadata, language versions and sitemap
        run: node scripts/validate-site.mjs public
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
