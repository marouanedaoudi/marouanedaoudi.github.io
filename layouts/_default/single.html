{{ define "main" }}

<style>
  .article-tag {
    background: rgba(79, 70, 229, 0.1);
    color: #4f46e5;
  }
  html.dark .article-tag {
    background: rgba(129, 140, 248, 0.15);
    color: #a5b4fc;
  }
</style>

<article class="max-w-4xl mx-auto px-6 py-12 font-sans text-neutral-800 dark:text-neutral-200">
  
  <header class="mb-10 text-center border-b border-neutral-200 dark:border-neutral-800 pb-8">
    <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight">{{ .Title }}</h1>
    
    <div class="flex flex-wrap justify-center items-center gap-4 text-sm mt-4">
      <span class="text-neutral-500 font-medium">{{ .Date.Format "2 Jan 2006" }}</span>
      
      {{ if .Params.tags }}
        <div class="flex gap-2">
          {{ range .Params.tags }}
            <span class="article-tag px-2 py-1 rounded-md font-bold text-xs uppercase tracking-wider">
              {{ . }}
            </span>
          {{ end }}
        </div>
      {{ end }}
    </div>
  </header>

  <div class="prose dark:prose-invert max-w-none text-lg leading-relaxed 
              prose-headings:font-bold prose-headings:text-neutral-900 dark:prose-headings:text-white
              prose-a:text-blue-600 dark:prose-a:text-blue-400 prose-a:no-underline hover:prose-a:underline
              prose-img:rounded-xl prose-img:shadow-lg prose-img:mx-auto">
    {{ .Content }}
  </div>

</article>
{{ end }}
