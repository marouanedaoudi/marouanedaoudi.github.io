{{ define "main" }}

<style>
  :root {
    --primary: #4f46e5;
    --primary-glow: rgba(79, 70, 229, 0.15);
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border: #e2e8f0;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  html.dark {
    --primary: #818cf8;
    --primary-glow: rgba(129, 140, 248, 0.15);
    --bg-card: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255,255,255,0.08);
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .notes-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 20px;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  .page-header {
    margin-bottom: 50px;
    padding-bottom: 30px;
    border-bottom: 1px solid var(--border);
  }
  .page-title {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 10px;
    letter-spacing: -0.02em;
  }
  .page-desc {
    font-size: 1rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .notes-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .note-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    text-decoration: none !important;
    box-shadow: var(--shadow);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .note-card:hover {
    transform: translateX(4px);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow), var(--shadow);
  }

  .note-date {
    font-family: monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 70px;
  }

  .note-content {
    flex-grow: 1;
  }
  .note-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 4px;
    transition: color 0.2s;
  }
  .note-card:hover .note-title {
    color: var(--primary);
  }
  .note-summary {
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .note-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .note-tag {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(79,70,229,0.1);
    color: var(--primary);
  }
  html.dark .note-tag {
    background: rgba(129,140,248,0.12);
  }

  .note-arrow {
    color: var(--text-muted);
    font-size: 1rem;
    transition: transform 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .note-card:hover .note-arrow {
    transform: translateX(4px);
    color: var(--primary);
  }

  @media (max-width: 600px) {
    .note-date { display: none; }
  }
</style>

<div class="notes-container">

  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    <p class="page-desc">{{ .Content | plainify }}</p>
  </header>

  <div class="notes-list">
    {{ range .Pages.ByDate.Reverse }}
    <a href="{{ .RelPermalink }}" class="note-card">

      <span class="note-date">{{ .Date.Format "Jan 2006" }}</span>

      <div class="note-content">
        <div class="note-title">{{ .Title }}</div>
        {{ with .Summary }}
          <div class="note-summary">{{ . | plainify }}</div>
        {{ end }}
        {{ if .Params.tags }}
        <div class="note-tags">
          {{ range .Params.tags }}
            <span class="note-tag">{{ . }}</span>
          {{ end }}
        </div>
        {{ end }}
      </div>

      <span class="note-arrow">→</span>
    </a>
    {{ end }}
  </div>

</div>

{{ end }}
