{{ define "main" }}{{ $fr := eq .Language.Lang "fr" }}
<div class="listing"><header class="page-heading"><h1>{{ .Title }}</h1>{{ with .Content }}<div class="prose lead">{{ . }}</div>{{ end }}</header>
<div class="note-filter" hidden><label for="note-query">{{ if $fr }}Filtrer les notes{{ else }}Filter notes{{ end }}</label><input id="note-query" type="search" placeholder="{{ if $fr }}Titre ou sujet…{{ else }}Title or topic…{{ end }}" aria-controls="all-notes"><p id="note-count" class="small muted" role="status"></p></div>
<ul id="all-notes" class="notes-list note-directory">{{ range .Pages.ByDate.Reverse }}<li data-note="{{ lower (printf "%s %s %s" .Title (.Params.subject | default "") (delimit .Params.tags " ")) }}"><a href="{{ .RelPermalink }}">{{ .Title }}</a><span class="note-subject">{{ with .Params.subject }}{{ . }}{{ else }}{{ with .Params.tags }}{{ index . 0 }}{{ end }}{{ end }}</span></li>{{ end }}</ul></div>
{{ end }}
