<!-- ── SEO : meta description ── -->
<meta name="description" content="{{ if .IsHome }}Site personnel de Marouane Daoudi, étudiant en Master de Mathématiques Appliquées à l'Université de Montpellier. Projets en optimisation, statistique et data science.{{ else if .Description }}{{ .Description }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}">
<meta name="author" content="Marouane Daoudi">

<!-- ── SEO : Open Graph ── -->
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}Marouane Daoudi{{ else }}{{ .Title }} — Marouane Daoudi{{ end }}">
<meta property="og:description" content="{{ if .IsHome }}Site personnel de Marouane Daoudi, étudiant en Master de Mathématiques Appliquées à l'Université de Montpellier.{{ else if .Description }}{{ .Description }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="Marouane Daoudi">
<meta property="og:image" content="https://github.com/marouanedaoudi.png">
<meta property="og:locale" content="fr_FR">

<!-- ── SEO : Twitter Card ── -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ if .IsHome }}Marouane Daoudi{{ else }}{{ .Title }} — Marouane Daoudi{{ end }}">
<meta name="twitter:description" content="{{ if .IsHome }}Site personnel de Marouane Daoudi, étudiant en Master de Mathématiques Appliquées à l'Université de Montpellier.{{ else if .Description }}{{ .Description }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}">
<meta name="twitter:image" content="https://github.com/marouanedaoudi.png">

<!-- ── SEO : JSON-LD Person ── -->
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Marouane Daoudi",
  "url": "https://marouanedaoudi.github.io/",
  "image": "https://github.com/marouanedaoudi.png",
  "jobTitle": "Étudiant en Master de Mathématiques Appliquées",
  "affiliation": {
    "@type": "Organization",
    "name": "Université de Montpellier"
  },
  "sameAs": [
    "https://github.com/marouanedaoudi"
  ],
  "knowsAbout": ["Optimisation convexe", "Statistique", "Data Science", "Machine Learning", "Python", "R"]
}
</script>
{{ end }}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      macros: { "\\_": "_" },
      throwOnError: false
    });
  });
</script>

<style>
  /* ── Site title → gradient text ── */
  .main-menu a.shrink {
    font-weight: 800;
    letter-spacing: -0.025em;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: opacity 0.2s ease;
  }
  html.dark .main-menu a.shrink {
    background: linear-gradient(135deg, #818cf8 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .main-menu a.shrink:hover { opacity: 0.72; }

  /* ── Nav pills ── */
  .main-menu nav a {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(99, 102, 241, 0.2);
    background: rgba(99, 102, 241, 0.05);
    font-weight: 500;
    transition:
      background  0.25s cubic-bezier(0.4, 0, 0.2, 1),
      border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
      color        0.25s cubic-bezier(0.4, 0, 0.2, 1),
      transform    0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow   0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  html.dark .main-menu nav a {
    border-color: rgba(129, 140, 248, 0.15);
    background: rgba(129, 140, 248, 0.06);
  }
  .main-menu nav a:hover {
    background: rgba(99, 102, 241, 0.1);
    border-color: rgba(99, 102, 241, 0.4);
    color: #4f46e5;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
  }
  html.dark .main-menu nav a:hover {
    background: rgba(129, 140, 248, 0.12);
    border-color: rgba(129, 140, 248, 0.4);
    color: #a5b4fc;
    box-shadow: 0 4px 12px rgba(129, 140, 248, 0.2);
  }

  /* ── Active nav pill ── */
  .main-menu nav a.nav-active {
    background: #4f46e5 !important;
    border-color: #4f46e5 !important;
    color: #ffffff !important;
    font-weight: 600;
    box-shadow: 0 2px 14px rgba(79, 70, 229, 0.4);
    transform: none !important;
  }
  html.dark .main-menu nav a.nav-active {
    background: #6366f1 !important;
    border-color: #6366f1 !important;
    box-shadow: 0 2px 14px rgba(99, 102, 241, 0.45);
  }

  /* ── Appearance switcher ── */
  #appearance-switcher {
    padding: 6px;
    border-radius: 999px;
    border: 1px solid rgba(99, 102, 241, 0.2);
    background: rgba(99, 102, 241, 0.05);
    transition:
      background   0.25s cubic-bezier(0.4, 0, 0.2, 1),
      border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
      transform    0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html.dark #appearance-switcher {
    border-color: rgba(129, 140, 248, 0.15);
    background: rgba(129, 140, 248, 0.06);
  }
  #appearance-switcher:hover {
    background: rgba(99, 102, 241, 0.1);
    border-color: rgba(99, 102, 241, 0.4);
    transform: scale(1.1) rotate(12deg);
  }
  html.dark #appearance-switcher:hover {
    background: rgba(129, 140, 248, 0.12);
    border-color: rgba(129, 140, 248, 0.4);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var path = window.location.pathname;
    document.querySelectorAll(".main-menu nav a").forEach(function (link) {
      var href = link.getAttribute("href");
      if (href === path || (href !== "/" && path.startsWith(href))) {
        link.classList.add("nav-active");
      }
    });
  });
</script>
