{{- $fr := eq .Language.Lang "fr" -}}
{{- $data := transform.Unmarshal (os.ReadFile "static/data/bandit-discoveries.json") -}}
{{- $dataset := index $data.datasets 0 -}}
{{- $archive := $dataset.modes.fixed -}}
{{- $maxStep := float $archive.maxStep -}}
{{- $maxCount := float $dataset.maxCount -}}
<figure class="work-preview"><a href="{{ .RelPermalink }}" aria-label="{{ if $fr }}Explorer les découvertes archivées du projet bandits{{ else }}Explore archived discoveries from the bandit project{{ end }}"><svg viewBox="0 0 360 210" role="img" aria-labelledby="bandit-preview-title"><title id="bandit-preview-title">EFFORT · {{ if $fr }}découvertes enregistrées, JJ{{ else }}recorded discoveries, JJ{{ end }}</title><desc>{{ if $fr }}Courbes en marches exactes du run 1, référence figée. L’adaptatif atteint 59 découvertes au pas 1950 ; l’uniforme au pas 22301.{{ else }}Exact step curves from run 1, frozen reference. Adaptive allocation reaches 59 discoveries at step 1950; uniform at step 22301.{{ end }}</desc><path d="M36 20V166H338" class="reference" stroke-dasharray="none"/>
{{ range $index, $series := slice $archive.uniform $archive.adaptive }}
  {{ $path := "" }}{{ range $i, $point := $series.curve }}{{ $x := add 36.0 (mul 302.0 (div (float (index $point 0)) $maxStep)) }}{{ $y := sub 166.0 (mul 140.0 (div (float (index $point 1)) $maxCount)) }}{{ if eq $i 0 }}{{ $path = printf "M %.2f %.2f" $x $y }}{{ else }}{{ $path = printf "%s H %.2f V %.2f" $path $x $y }}{{ end }}{{ end }}<path d="{{ $path }} H338" class="{{ if eq $index 1 }}series-accent{{ else }}series{{ end }}"{{ if eq $index 0 }} stroke-dasharray="4 3"{{ end }}/>
{{ end }}
