{{ $fr := eq .Language.Lang "fr" }}
<figure class="scientific-figure" data-figure="recip" data-source="/data/recip-examples.json">
  <figcaption>{{ if $fr }}Suivre les données d’une recette jusqu’au score{{ else }}Trace a recipe’s data through to its score{{ end }}</figcaption>
  <svg role="img" aria-label="{{ if $fr }}Pipeline : ingrédients, contributions pondérées, normalisation pour 100 grammes, puis points et lettre.{{ else }}Pipeline: ingredients, weighted contributions, normalization per 100 grams, then points and a grade.{{ end }}" viewBox="0 0 480 130"><title>{{ if $fr }}Pipeline de calcul du dépôt{{ else }}Repository calculation pipeline{{ end }}</title><path d="M45 40H435" fill="none" stroke="var(--muted)"/><g fill="var(--paper)" stroke="var(--ink)"><circle cx="45" cy="40" r="4"/><circle cx="175" cy="40" r="4"/><circle cx="305" cy="40" r="4"/><circle cx="435" cy="40" r="4"/></g><g text-anchor="middle" font-size="13"><text x="45" y="70">{{ if $fr }}Ingrédients{{ else }}Ingredients{{ end }}</text><text x="175" y="70">{{ if $fr }}Pondération{{ else }}Weighting{{ end }}</text><text x="305" y="70">100 g</text><text x="435" y="70">{{ if $fr }}Score{{ else }}Score{{ end }}</text></g></svg>
  <div class="figure-controls" hidden><label>{{ if $fr }}Recette du dépôt{{ else }}Repository recipe{{ end }} <select style="max-width:100%"><option>{{ if $fr }}Chargement{{ else }}Loading{{ end }}</option></select></label><button type="button" data-previous>{{ if $fr }}Précédent{{ else }}Previous{{ end }}</button><button type="button" data-next>{{ if $fr }}Suivant{{ else }}Next{{ end }}</button><button type="button" data-reset>{{ if $fr }}Recommencer{{ else }}Reset{{ end }}</button></div>
  <p class="figure-readout" data-step-status role="status">{{ if $fr }}Trois recettes et leurs ingrédients proviennent des CSV du dépôt. Activer JavaScript permet de parcourir les quatre étapes.{{ else }}Three recipes and their ingredients come from the repository CSVs. JavaScript enables the four-stage walkthrough.{{ end }}</p><div data-recip-details></div>
  <p class="figure-source">{{ if $fr }}Implémentation historique du projet, pas le Nutri-Score officiel actuel. Les seuils d’énergie sont appliqués à la colonne kcal ; les lipides totaux remplacent les AGS ; les points fruits/légumes valent zéro.{{ else }}Historical project implementation, not the current official Nutri-Score. Energy thresholds are applied to the kcal column; total fat is used for saturated fat; fruit/vegetable points are zero.{{ end }} <a href="https://github.com/akram3409/recip_score/blob/555fd16f85f032bfe999311d2bb26f5a57f88f35/backend/nutriscore_calculation.py">nutriscore_calculation.py</a></p>
</figure>
