{{- $fr := eq .Language.Lang "fr" -}}
{{- $data := transform.Unmarshal (os.ReadFile "static/data/bandit-discoveries.json") -}}
{{- $dataset := index $data.datasets 0 -}}
{{- $archive := $dataset.modes.fixed -}}
{{- $maxStep := float $archive.maxStep -}}
{{- $maxCount := float $dataset.maxCount -}}
<div data-bandit-figure data-lang="{{ .Language.Lang }}" data-source="{{ "/data/bandit-discoveries.json" | relURL }}">
  <figure class="scientific-figure" aria-labelledby="bandit-archive-title">
    <figcaption id="bandit-archive-title">{{ if $fr }}Découvrir plus tôt : une exécution archivée{{ else }}Earlier discovery: an archived run{{ end }}</figcaption>
    <p data-archive-caption>EFFORT · JJ · {{ if $fr }}Référence figée{{ else }}Frozen reference{{ end }}</p>
    <div class="figure-controls">
      <label>{{ if $fr }}Jeu de données{{ else }}Dataset{{ end }} <select data-dataset><option value="effort">EFFORT</option><option value="exercise">EXERCISE</option><option value="penn">PENN</option><option value="walmart">WALMART</option></select></label>
      <label>{{ if $fr }}Référence{{ else }}Reference{{ end }} <select data-reference><option value="fixed">{{ if $fr }}Figée{{ else }}Frozen{{ end }}</option><option value="online">{{ if $fr }}Contrôle rééchantillonné (VAR){{ else }}Resampled control (VAR){{ end }}</option></select></label>
    </div>
    <svg viewBox="0 0 600 300" role="img" aria-labelledby="bandit-archive-title" data-archive-chart>
      <title>EFFORT · JJ · {{ if $fr }}Référence figée{{ else }}Frozen reference{{ end }}</title>
      <desc>{{ if $fr }}Nombre cumulé des découvertes enregistrées, calculé directement à partir des pas de première découverte de l’archive.{{ else }}Cumulative recorded discoveries, calculated directly from the archive’s first-discovery steps.{{ end }}</desc>
      <path d="M56 38V238H540" class="axis"/>
      {{ range $index := seq 0 4 }}
      <text x="{{ add 56 (mul $index 121) }}" y="258" text-anchor="middle" class="tick-label">{{ math.Round (mul (div $maxStep 4.0) $index) | int }}</text>
      <text x="46" y="{{ sub 242 (mul $index 47.5) }}" text-anchor="end" class="tick-label">{{ math.Round (mul (div $maxCount 4.0) $index) | int }}</text>
      {{ end }}
      <text x="56" y="22" class="tick-label">{{ if $fr }}Découvertes enregistrées{{ else }}Recorded discoveries{{ end }}</text>
      {{ range $index, $series := slice $archive.uniform $archive.adaptive }}
        {{ $path := "" }}
        {{ range $i, $point := $series.curve }}
          {{ $x := add 56.0 (mul 484.0 (div (float (index $point 0)) $maxStep)) }}
          {{ $y := sub 238.0 (mul 190.0 (div (float (index $point 1)) $maxCount)) }}
          {{ if eq $i 0 }}{{ $path = printf "M %.2f %.2f" $x $y }}{{ else }}{{ $path = printf "%s H %.2f V %.2f" $path $x $y }}{{ end }}
        {{ end }}
        <path d="{{ $path }} H540" class="{{ if eq $index 1 }}series-accent{{ else }}series{{ end }}"{{ if eq $index 0 }} stroke-dasharray="5 3"{{ end }}/>
      {{ end }}
      <line x1="56" x2="80" y1="280" y2="280" class="series-accent"/><text x="86" y="284" class="tick-label">{{ if $fr }}Adaptatif{{ else }}Adaptive{{ end }}</text>
      <line x1="190" x2="214" y1="280" y2="280" class="series" stroke-dasharray="5 3"/><text x="220" y="284" class="tick-label">{{ if $fr }}Uniforme{{ else }}Uniform{{ end }}</text>
      <text x="540" y="282" text-anchor="end" class="tick-label">{{ if $fr }}Pas archivé{{ else }}Archived step{{ end }}</text>
    </svg>
    <div class="figure-controls">
      <label>{{ if $fr }}Pas{{ else }}Step{{ end }} <input type="range" min="0" max="{{ $archive.maxStep }}" step="1" value="{{ $dataset.defaultBudget }}" data-budget></label>
      <label>{{ if $fr }}Valeur exacte{{ else }}Exact value{{ end }} <input type="number" min="0" max="{{ $archive.maxStep }}" step="1" value="{{ $dataset.defaultBudget }}" data-budget-number style="width:8em;max-width:100%"></label>
      <button type="button" data-previous>{{ if $fr }}Découverte précédente{{ else }}Previous discovery{{ end }}</button>
      <button type="button" data-next>{{ if $fr }}Découverte suivante{{ else }}Next discovery{{ end }}</button>
    </div>
    <p class="figure-readout" aria-live="polite" data-archive-readout>{{ if $fr }}Au pas{{ else }}At step{{ end }} {{ $dataset.defaultBudget }} : {{ $archive.defaultCounts.adaptive }} {{ if $fr }}en adaptatif,{{ else }}adaptive,{{ end }} {{ $archive.defaultCounts.uniform }} {{ if $fr }}en uniforme.{{ else }}uniform.{{ end }}</p>
    <table aria-label="{{ if $fr }}Découvertes au pas sélectionné{{ else }}Discoveries at the selected step{{ end }}"><thead><tr><th>{{ if $fr }}Allocation{{ else }}Allocation{{ end }}</th><th>{{ if $fr }}Découvertes enregistrées{{ else }}Recorded discoveries{{ end }}</th></tr></thead><tbody><tr><td>{{ if $fr }}Adaptative{{ else }}Adaptive{{ end }}</td><td data-count-adaptive>{{ $archive.defaultCounts.adaptive }}</td></tr><tr><td>{{ if $fr }}Uniforme{{ else }}Uniform{{ end }}</td><td data-count-uniform>{{ $archive.defaultCounts.uniform }}</td></tr></tbody></table>
    <p class="figure-source">{{ if $fr }}Les marches sont exactes pour le run 1 des fichiers TXT ; il ne s’agit ni d’une moyenne sur les simulations, ni d’un TPR ou d’un FDR. Le pas 0 correspond aux découvertes à l’initialisation. L’horizon, la graine et le niveau δ de ces runs ne sont pas consignés dans ces fichiers.{{ else }}Steps are exact for run 1 of the TXT files; they are neither simulation averages nor TPR or FDR. Step 0 denotes discoveries at initialization. These files do not record the runs’ horizon, seed or δ level.{{ end }} <a href="{{ $dataset.sources.discovery.url }}" data-archive-source>{{ if $fr }}Archive source{{ else }}Source archive{{ end }} · EFFORT / discovery_times.txt</a> · <a href="{{ "/data/bandit-discoveries.json" | relURL }}">JSON</a>.</p>
  </figure>

  <figure class="scientific-figure" aria-labelledby="bandit-mechanics-title">
    <figcaption id="bandit-mechanics-title">{{ if $fr }}Du rayon de confiance à la décision BH{{ else }}From a confidence radius to the BH decision{{ end }}</figcaption>
    <p>{{ if $fr }}Exemple numérique pédagogique : trois séquences périodiques fixées, indépendantes des archives ci-dessus. Chaque bras utilise les n premières observations de sa séquence. On examine un état du calcul V2, sans rejouer l’allocation adaptative.{{ else }}A numerical teaching example: three fixed periodic sequences, unrelated to the archives above. Each arm uses the first n observations of its sequence. This inspects one V2 snapshot without replaying adaptive allocation.{{ end }}</p>
    <div class="figure-controls">
      <label>n = <output data-example-n>6</output><input type="range" min="3" max="60" step="1" value="6" data-example-count aria-label="{{ if $fr }}Nombre d’observations par bras{{ else }}Observations per arm{{ end }}"></label>
      <label>δ = <output data-example-alpha>0.05</output><input type="range" min="0.01" max="0.20" step="0.01" value="0.05" data-example-delta aria-label="{{ if $fr }}Niveau nominal delta{{ else }}Nominal delta level{{ end }}"></label>
      <label><input type="checkbox" data-example-control> {{ if $fr }}Inclure l’incertitude du contrôle{{ else }}Include control uncertainty{{ end }}</label>
    </div>
    <svg viewBox="0 0 600 230" role="img" aria-labelledby="bandit-mechanics-title" data-example-chart><title>{{ if $fr }}Écarts à la référence et rayons calculés{{ else }}Reference gaps and computed radii{{ end }}</title><desc>{{ if $fr }}Les formules et les séquences utilisées sont détaillées dans le texte et le JSON. Activez JavaScript pour modifier ce calcul.{{ else }}The formulas and sequences are documented in the text and JSON. Enable JavaScript to change this calculation.{{ end }}</desc>
      <line x1="303" x2="303" y1="24" y2="186" class="reference"/><text x="303" y="18" text-anchor="middle" class="tick-label">0</text>
      {{ range $data.workedExample.defaultSnapshot.intervals }}
      <text x="12" y="{{ add .y 4 }}" class="tick-label">{{ .label }}</text><line x1="{{ .xLow }}" x2="{{ .xHigh }}" y1="{{ .y }}" y2="{{ .y }}" class="{{ if .retained }}series-accent{{ else }}series{{ end }}"/><circle cx="{{ .xMean }}" cy="{{ .y }}" r="3" fill="{{ if .retained }}var(--accent){{ else }}var(--muted){{ end }}"/>
      {{ end }}
    </svg>
    <p class="figure-readout" aria-live="polite" data-example-readout>n = 6 ; k* = {{ $data.workedExample.defaultSnapshot.k }} ; ρ = 0.05.</p>
    <table data-example-table aria-label="{{ if $fr }}Calcul de la décision par bras{{ else }}Decision calculation by arm{{ end }}"><thead><tr><th>{{ if $fr }}Rang · bras{{ else }}Rank · arm{{ end }}</th><th>p</th><th>δk/m</th></tr></thead><tbody>{{ range $data.workedExample.defaultSnapshot.sorted }}<tr><td>{{ .rank }} · {{ .label }}</td><td>{{ .pDisplay }}</td><td>{{ .thresholdDisplay }}</td></tr>{{ end }}</tbody></table>
    <p class="figure-readout" data-example-note>{{ if $fr }}Référence connue μ₀ = 0,20 ; ρ = 0,05 fixé.{{ else }}Known reference μ₀ = 0.20; fixed ρ = 0.05.{{ end }}</p>
    <details><summary>{{ if $fr }}Séquences et lecture des intervalles{{ else }}Sequences and interval interpretation{{ end }}</summary><p>{{ if $fr }}Les six valeurs de chaque cycle sont répétées.{{ else }}Each six-value cycle repeats.{{ end }} A : 0.65, 0.70, 0.60, 0.72, 0.62, 0.68 ; B : 0.35, 0.45, 0.40, 0.30, 0.42, 0.38 ; C : 0.18, 0.25, 0.20, 0.17, 0.23, 0.19 ; {{ if $fr }}contrôle{{ else }}control{{ end }} : 0.17, 0.21, 0.20, 0.19, 0.23, 0.20.</p><p>{{ if $fr }}Le point représente l’écart de moyenne ; le segment ajoute et retranche le rayon calculé au niveau α = δ max(1,k*)/m. Si le contrôle est inclus, le segment utilise φᵢ(α/2) + φ꜀(α/2), avec m = 4 comme dans le helper V2. Sinon, m = 3. Ces nombres illustrent la règle implémentée ; ils ne démontrent pas sa couverture statistique.{{ else }}The point is the mean gap; the segment adds and subtracts the computed radius at α = δ max(1,k*)/m. With control uncertainty, it uses φᵢ(α/2) + φ꜀(α/2), with m = 4 as in the V2 helper. Otherwise m = 3. These numbers illustrate the implemented rule, rather than prove statistical coverage.{{ end }}</p></details>
    <p class="figure-source">{{ if $fr }}Formules reproduites de{{ else }}Formulas reproduced from{{ end }} <a href="https://github.com/Chams22/bandit_approach_simulation/blob/bdff6ab960ac0bbab47daa2f1aa5389400b7994f/backend/adaptative_algorithm_v2.py#L106-L159">V2, lignes 106–159</a> {{ if $fr }}et du{{ else }}and its{{ end }} <a href="https://github.com/Chams22/bandit_approach_simulation/blob/bdff6ab960ac0bbab47daa2f1aa5389400b7994f/backend/adaptative_algorithm_v2.py#L35-L58">helper bi-échantillon</a>. {{ if $fr }}Données pédagogiques, pas un résultat expérimental du projet.{{ else }}Teaching data, not an experimental result from the project.{{ end }}</p>
  </figure>
  <noscript><p>{{ if $fr }}Les figures statiques et tableaux restent disponibles. JavaScript active les sélecteurs, le curseur temporel et le calcul pédagogique.{{ else }}Static figures and tables remain available. JavaScript enables selectors, the time cursor and the teaching calculation.{{ end }}</p></noscript>
</div>
